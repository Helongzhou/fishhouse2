<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>峡谷冤种门诊 · 诊断证明书</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f3ebe0;
      --ink: #111;
      --ink-soft: #5a4d42;
      --rule: #222;
      --stamp: #b42318;
      --stamp-soft: rgba(180, 35, 24, 0.12);
      --seal: #d32f2f;
      --shadow: 0 18px 50px rgba(40, 24, 12, 0.18);
      --doc-bg: #fffcf7;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 10%, rgba(180, 35, 24, 0.08), transparent 42%),
        radial-gradient(ellipse at 90% 0%, rgba(80, 55, 30, 0.08), transparent 35%),
        linear-gradient(160deg, #d9cbb8 0%, #cfc0aa 45%, #bba890 100%);
      background-attachment: fixed;
    }

    .noise {
      pointer-events: none;
      position: fixed;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(720px, calc(100% - 28px));
      margin: 28px auto 64px;
    }

    .masthead {
      text-align: center;
      margin-bottom: 18px;
      animation: rise 0.7s ease both;
    }
    .masthead .brand {
      font-family: "ZCOOL QingKe HuangYou", "Noto Serif SC", serif;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: 0.08em;
      color: var(--stamp);
      line-height: 1.1;
    }
    .masthead p {
      margin: 10px 0 0;
      color: var(--ink-soft);
      font-size: 0.95rem;
    }
    .badge-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .pill {
      border: 1px solid var(--stamp);
      color: var(--stamp);
      background: var(--stamp-soft);
      padding: 4px 10px;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }

    .panel {
      background: linear-gradient(180deg, #f7f0e6, var(--paper));
      border: 1px solid #b9a48a;
      box-shadow: var(--shadow);
      padding: 22px 20px 24px;
      animation: rise 0.75s ease 0.08s both;
    }

    .step { margin-bottom: 22px; }
    .step h2 {
      margin: 0 0 10px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--stamp);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .step h2::before {
      content: attr(data-n);
      display: inline-grid;
      place-items: center;
      width: 1.4rem;
      height: 1.4rem;
      border: 1px solid var(--stamp);
      font-size: 0.75rem;
      background: #fff8f0;
    }

    .field {
      width: 100%;
      border: 1px solid #c9b8a2;
      background: rgba(255, 255, 255, 0.55);
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      outline: none;
    }
    .field:focus {
      border-color: var(--stamp);
      box-shadow: 0 0 0 3px var(--stamp-soft);
    }
    .hint {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .options {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr;
    }
    @media (min-width: 560px) {
      .options.lanes { grid-template-columns: repeat(5, 1fr); }
      .options.ranks { grid-template-columns: repeat(4, 1fr); }
    }

    .opt {
      appearance: none;
      border: 1px solid #c9b8a2;
      background: rgba(255, 255, 255, 0.45);
      color: var(--ink);
      font: inherit;
      padding: 12px 10px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.15s ease, background 0.15s, border-color 0.15s, color 0.15s;
    }
    .opt:hover { transform: translateY(-1px); }
    .opt.active {
      border-color: var(--stamp);
      background: var(--stamp-soft);
      color: var(--stamp);
      font-weight: 700;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 14px 16px;
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      background: var(--stamp);
      color: #fff8f0;
      box-shadow: 0 8px 20px rgba(180, 35, 24, 0.28);
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-ghost {
      background: transparent;
      color: var(--ink-soft);
      border: 1px dashed #c9b8a2;
    }

    .disclaimer {
      margin-top: 16px;
      padding: 12px 14px;
      border-left: 3px solid var(--stamp);
      background: rgba(255, 255, 255, 0.35);
      color: var(--ink-soft);
      font-size: 0.78rem;
      line-height: 1.55;
    }

    .result-view { display: none; }
    .result-view.show { display: block; animation: rise 0.55s ease both; }
    .form-view.hide { display: none; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .toolbar .btn { flex: 1; min-width: 140px; }

    .poster-shell {
      display: flex;
      justify-content: center;
      padding: 4px;
    }

    /* ===== Real outpatient certificate look ===== */
    .poster {
      width: min(440px, 100%);
      background: var(--doc-bg);
      border: 1px solid #888;
      box-shadow: var(--shadow);
      padding: 22px 20px 18px;
      position: relative;
      color: #111;
      overflow: hidden;
    }

    .doc-hospital {
      text-align: center;
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      line-height: 1.25;
    }
    .doc-sub {
      text-align: center;
      margin-top: 4px;
      font-size: 0.72rem;
      color: #444;
      letter-spacing: 0.04em;
    }
    .doc-title {
      text-align: center;
      margin: 14px 0 8px;
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: 0.35em;
      text-indent: 0.35em;
    }
    .doc-no {
      text-align: right;
      font-size: 0.78rem;
      margin-bottom: 8px;
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      table-layout: fixed;
    }
    .info-table th,
    .info-table td {
      border: 1px solid #222;
      padding: 7px 6px;
      vertical-align: middle;
      word-break: break-all;
    }
    .info-table th {
      width: 18%;
      font-weight: 700;
      background: #f7f7f7;
      white-space: nowrap;
      text-align: center;
    }
    .info-table td { text-align: left; }

    .clinical {
      margin-top: 16px;
      font-size: 0.9rem;
      line-height: 1.75;
    }
    .clinical .row {
      margin-bottom: 18px;
      min-height: 2.6em;
    }
    .clinical .label {
      font-weight: 900;
      display: inline;
    }
    .clinical .value {
      display: inline;
      border-bottom: 1px solid transparent;
    }
    .clinical .diagnosis-name {
      font-weight: 700;
      font-size: 1.02rem;
    }
    .clinical ol {
      margin: 6px 0 0 1.2em;
      padding: 0;
    }
    .clinical li { margin: 2px 0; }

    .sign-block {
      margin-top: 28px;
      display: flex;
      justify-content: flex-end;
      position: relative;
      min-height: 96px;
    }
    .sign-inner {
      text-align: left;
      font-size: 0.88rem;
      line-height: 1.8;
      position: relative;
      z-index: 1;
      min-width: 46%;
    }
    .doctor-sign {
      font-family: "ZCOOL QingKe HuangYou", "Noto Serif SC", serif;
      font-size: 1.25rem;
      color: #1a3a8a;
      letter-spacing: 0.08em;
      transform: rotate(-4deg);
      display: inline-block;
      margin-left: 4px;
    }

    .seal {
      position: absolute;
      right: 8px;
      bottom: -6px;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      border: 3px solid var(--seal);
      color: var(--seal);
      display: grid;
      place-items: center;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.04em;
      transform: rotate(-16deg);
      opacity: 0.88;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: inset 0 0 0 1px rgba(211, 47, 47, 0.45);
      z-index: 2;
      animation: stamp-in 0.55s cubic-bezier(.2,.9,.2,1) 0.2s both;
      padding: 10px;
    }
    .seal .star {
      font-size: 0.85rem;
      margin: 2px 0;
    }

    .doc-note {
      margin-top: 18px;
      font-size: 0.72rem;
      color: #333;
      line-height: 1.5;
    }
    .share-hook {
      margin-top: 10px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--stamp);
      font-weight: 700;
    }
    .fineprint {
      margin-top: 8px;
      font-size: 0.65rem;
      line-height: 1.45;
      color: #777;
      text-align: justify;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      background: #111;
      color: #f7f0e6;
      padding: 10px 14px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 20;
      max-width: calc(100% - 32px);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes stamp-in {
      from { opacity: 0; transform: rotate(-16deg) scale(1.35); }
      to { opacity: 0.88; transform: rotate(-16deg) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <div class="wrap">
    <header class="masthead">
      <div class="brand">峡谷冤种门诊</div>
      <p>点选病情 → 开具「诊断证明书」海报</p>
      <div class="badge-row">
        <span class="pill">纯娱乐吐槽</span>
        <span class="pill">非真实匹配数据</span>
        <span class="pill">同名同判</span>
      </div>
    </header>

    <section class="panel form-view" id="formView">
      <div class="step">
        <h2 data-n="1">姓名（游戏昵称）</h2>
        <input class="field" id="nickname" maxlength="16" placeholder="写入病历姓名栏，并作为稳定种子" autocomplete="off" />
        <p class="hint">同一昵称每次结果相同；不同昵称各不相同。仅本地计算，不会上传。</p>
      </div>

      <div class="step">
        <h2 data-n="2">当前段位</h2>
        <div class="options ranks" id="rankOptions"></div>
      </div>

      <div class="step">
        <h2 data-n="3">近期战绩（主诉素材）</h2>
        <div class="options" id="recordOptions"></div>
      </div>

      <div class="step">
        <h2 data-n="4">常用分路（职业）</h2>
        <div class="options lanes" id="laneOptions"></div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="generateBtn" disabled>开具诊断证明书</button>
      </div>

      <aside class="disclaimer">
        本页为娱乐向吐槽生成器，仿门诊证明书版式仅供玩梗。所有「诊断」「处理意见」均为虚构段子，与任何游戏官方、匹配系统无关。未成年人请在监护人指导下使用，请勿用于引战或骚扰他人。
      </aside>
    </section>

    <section class="result-view" id="resultView">
      <div class="toolbar">
        <button class="btn btn-primary" id="saveBtn">保存证明书海报</button>
        <button class="btn btn-ghost" id="againBtn">开一张平行病历</button>
        <button class="btn btn-ghost" id="backBtn">返回修改</button>
      </div>
      <div class="poster-shell">
        <article class="poster" id="poster" aria-label="诊断证明书海报"></article>
      </div>
      <aside class="disclaimer">
        分享时请注明娱乐向。搜索词：峡谷冤种门诊
      </aside>
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const RANKS = [
      { id: "star", label: "高分段入门" },
      { id: "king_low", label: "王者低星档" },
      { id: "king_mid", label: "无双档" },
      { id: "king_top", label: "荣耀巅峰档" },
    ];

    const RECORDS = [
      { id: "win_then_lose", label: "连胜后突然崩盘" },
      { id: "alternate", label: "赢一局输一局" },
      { id: "pure_lose", label: "纯纯连败" },
      { id: "rankup_crash", label: "刚上大段就崩盘" },
    ];

    const LANES = [
      { id: "top", label: "对抗路" },
      { id: "jg", label: "打野" },
      { id: "mid", label: "中路" },
      { id: "adc", label: "发育路" },
      { id: "sup", label: "游走" },
    ];

    const CHIEF_COMPLAINT = {
      win_then_lose: (n) => `连胜后突然连跪${n}局，伴情绪波动、失眠倾向1晚`,
      alternate: (n) => `近${n + 2}局呈「赢一输一」节律，自觉被精准五五开，伴无力感`,
      pure_lose: (n) => `连跪${n}局，伴语音区血压升高、结算页不敢看`,
      rankup_crash: (n) => `刚上大段后连崩${n}局，自觉「晋级税」发作`,
    };

    const JOB_TITLE = {
      top: "对抗路抗压员",
      jg: "打野节奏调度员",
      mid: "中路线权志愿者",
      adc: "发育路工期管理员",
      sup: "游走视野义工",
    };

    const DOCTORS = ["王匹配", "李隐藏分", "张日活", "赵峡谷", "陈段位"];

    /** @type {{id:string, title:string, seal:string, logic:string, quote:string, advice:string[], when:(c:any)=>boolean}[]} */
    const CASES = [
      {
        id: "svp_factory",
        title: "败方高光综合征",
        seal: "病情证明",
        logic: "近期评分偏高，匹配池倾向将其放入「需有人扛锅」房间；队友沟通意愿低，患者仍尝试回拉节奏。",
        quote: "败方高光视为精神损失费。",
        advice: ["对症停损：连败三局立即下号", "门诊随诊：改打娱乐局缓冲", "建议休息治疗：今晚只保心态不上星"],
        when: (c) => (c.lane === "jg" || c.lane === "adc") && c.record === "pure_lose",
      },
      {
        id: "daily_worker",
        title: "头铁型日活贡献症",
        seal: "病情证明",
        logic: "患者不易退游，隐藏分区间稳定，房间内常被用作「体验缓冲垫」，胜率趋近五五开。",
        quote: "疑似签订电子义务劳动协议。",
        advice: ["打断赢一输一节律", "固定双排减少随机税", "建议休息：少看战绩页对比"],
        when: (c) => c.record === "alternate",
      },
      {
        id: "win_curse",
        title: "连胜后难度上调反应",
        seal: "病情证明",
        logic: "连胜抬升房间难度后出现崩盘；属虚构「防飘机制」适应期，而非操作突然退化。",
        quote: "你该赢够了，队友还可以再练练。",
        advice: ["降低开局强度，改用熟练英雄", "少开麦争执", "保段优先于冲星"],
        when: (c) => c.record === "win_then_lose" && (c.lane === "sup" || c.lane === "mid"),
      },
      {
        id: "solo_orphan",
        title: "边路单机隔离状态",
        seal: "病情证明",
        logic: "长期锁边路，匹配池默认抗压强、无需关怀；中野游走抱团对侧，患者塔下单机时长偏高。",
        quote: "打的是五排，过的是单机。",
        advice: ["提前约定支援窗口", "对线以不送为第一KPI", "建议休息：少为气势交两波节奏"],
        when: (c) => c.lane === "top" && (c.record === "alternate" || c.record === "pure_lose"),
      },
      {
        id: "rankup_tax",
        title: "晋级税急性发作",
        seal: "病情证明",
        logic: "大段跃迁后进入适应期房间，队友磨合差、对手更凶，表现为「刚上就崩」。",
        quote: "大段是门票，税在下一局收。",
        advice: ["晋级后先打热身局", "勿连夜冲星", "今晚唯一目标：站稳"],
        when: (c) => c.record === "rankup_crash",
      },
      {
        id: "vision_saint",
        title: "视野义务过劳",
        seal: "病情证明",
        logic: "游走位被默认定责全图保姆；开团被骂节奏，发育被骂没视野，责任感被过度征用。",
        quote: "为地图打工，结算只记死亡。",
        advice: ["把「能开」改成「该开」", "减少无效死亡", "门诊随诊：对齐开团预期"],
        when: (c) => c.lane === "sup",
      },
      {
        id: "jungle_blame",
        title: "天降锅盖综合征",
        seal: "病情证明",
        logic: "打野位叙事压力最高，雪球与崩线易被归因于野；连败时归因失真加重。",
        quote: "不是带不动，是情绪要出口。",
        advice: ["前八分钟只拿能拿的目标", "少听催促，多看小地图", "建议休息治疗贰局"],
        when: (c) => c.lane === "jg",
      },
      {
        id: "mid_tempo",
        title: "中路全能期待过载",
        seal: "病情证明",
        logic: "既被要求对线又被要求支援；支援丢线权，清线则边路喊，期待相互矛盾。",
        quote: "以为在带节奏，其实在填坑。",
        advice: ["每局只选一个主支援侧", "与其两边迟到不如一边打穿", "随诊观察心态"],
        when: (c) => c.lane === "mid",
      },
      {
        id: "adc_farm",
        title: "发育工期延误反应",
        seal: "病情证明",
        logic: "发育需要时间，房间节奏不等待；「再两波」常被解读为消极参团。",
        quote: "经济曲线诚实，房间耐心不诚实。",
        advice: ["明确告知几级参团", "用一句话对齐预期", "建议休息：少默默挨打"],
        when: (c) => c.lane === "adc",
      },
      {
        id: "high_mmr_bait",
        title: "高光诱饵型体验担保",
        seal: "病情证明",
        logic: "高段位房间对稳定发挥索取更强，患者易被写入他人上分/掉分剧本。",
        quote: "定海神针，亦是背锅首选。",
        advice: ["避开巅峰拥堵时段", "英雄池收缩至最熟两三名", "门诊随诊"],
        when: (c) => c.rank === "king_top" || c.rank === "king_mid",
      },
      {
        id: "generic_victim",
        title: "匹配池情绪回收状态",
        seal: "病情证明",
        logic: "患者会继续打、会反思、易揽责，连败被包装成「再来一把就能翻」。",
        quote: "不是玄学针对，是太适合再打一把。",
        advice: ["硬性停损：两连败洗澡", "三连败睡觉", "身体下线优先于心态下线"],
        when: () => true,
      },
    ];

    const state = {
      nickname: "",
      rank: "",
      record: "",
      lane: "",
      variant: 0,
    };

    const $ = (id) => document.getElementById(id);
    const toastEl = $("toast");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function hashString(input) {
      let h = 2166136261;
      for (let i = 0; i < input.length; i++) {
        h ^= input.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }

    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function seedKey() {
      return [state.nickname.trim(), state.rank, state.record, state.lane, state.variant].join("|");
    }

    function pickCase(ctx, rand) {
      const matched = CASES.filter((c) => c.when(ctx));
      const pool = matched.length ? matched : CASES.slice(-1);
      return pool[Math.floor(rand() * pool.length)];
    }

    function renderOptions(container, items, key) {
      container.innerHTML = "";
      items.forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt" + (state[key] === item.id ? " active" : "");
        btn.textContent = item.label;
        btn.addEventListener("click", () => {
          state[key] = item.id;
          renderOptions(container, items, key);
          syncGenerate();
        });
        container.appendChild(btn);
      });
    }

    function syncGenerate() {
      $("generateBtn").disabled = !(
        state.nickname.trim().length >= 1 &&
        state.rank &&
        state.record &&
        state.lane
      );
    }

    function labelOf(list, id) {
      return list.find((x) => x.id === id)?.label || id;
    }

    function buildPoster() {
      const name = state.nickname.trim() || "匿名召唤师";
      const rand = mulberry32(hashString(seedKey()));
      const ctx = {
        rank: state.rank,
        record: state.record,
        lane: state.lane,
      };
      const item = pickCase(ctx, rand);
      const loseN = 3 + Math.floor(rand() * 5); // 3-7
      const gender = rand() > 0.5 ? "男" : "女";
      const age = 16 + Math.floor(rand() * 18); // 16-33 峡谷年龄玩笑
      const outpatientNo = String(1000000000 + Math.floor(rand() * 8999999999)).slice(0, 10);
      const doctor = DOCTORS[Math.floor(rand() * DOCTORS.length)];
      const today = new Date();
      const dateStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
      const job = `${JOB_TITLE[state.lane]}（${labelOf(RANKS, state.rank)}）`;
      const chief = CHIEF_COMPLAINT[state.record](loseN);
      const adviceHtml = item.advice
        .map((a, i) => `<li>${i + 1}. ${a}</li>`)
        .join("");

      $("poster").innerHTML = `
        <div class="doc-hospital">峡谷冤种门诊部</div>
        <div class="doc-sub">娱乐向情绪康复专科（非医疗机构 · 纯属玩梗）</div>
        <div class="doc-title">诊断证明书</div>
        <div class="doc-no">编号：YK${outpatientNo.slice(-6)}</div>

        <table class="info-table">
          <tr>
            <th>姓名</th>
            <td>${escapeHtml(name)}</td>
            <th>性别</th>
            <td>${gender}</td>
          </tr>
          <tr>
            <th>年龄</th>
            <td>${age}岁</td>
            <th>门诊号</th>
            <td>${outpatientNo}</td>
          </tr>
          <tr>
            <th>职业</th>
            <td colspan="3">${job}</td>
          </tr>
          <tr>
            <th>分路/单位</th>
            <td colspan="3">峡谷排位赛场 · ${labelOf(LANES, state.lane)}</td>
          </tr>
        </table>

        <div class="clinical">
          <div class="row">
            <span class="label">主诉：</span>
            <span class="value">${chief}</span>
          </div>
          <div class="row">
            <span class="label">诊断：</span>
            <span class="value diagnosis-name">1、${item.title}</span>
            <div style="margin-top:6px;font-size:0.84rem;color:#333;">（附记）${item.logic} ${item.quote}</div>
          </div>
          <div class="row">
            <span class="label">处理意见：</span>
            <ol>${adviceHtml}</ol>
          </div>
        </div>

        <div class="sign-block">
          <div class="seal" aria-hidden="true">
            <div>峡谷冤种门诊部</div>
            <div class="star">★</div>
            <div>${item.seal}</div>
          </div>
          <div class="sign-inner">
            <div>经治医生：<span class="doctor-sign">${doctor}</span></div>
            <div>${dateStr}</div>
          </div>
        </div>

        <p class="doc-note">注：本证明必须加盖本院公章有效，涂改无效。（玩梗章，无法律效力）</p>
        <div class="share-hook">将此图发至群聊，立刻获得今日豁免权（假的）</div>
        <p class="fineprint">
          娱乐声明：本单为段子生成内容，非医学诊断、非官方鉴定，与任何游戏公司及匹配算法无关；禁止用于攻击、歧视或骚扰他人。搜索「峡谷冤种门诊」可自测。
        </p>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function showResult() {
      state.variant = 0;
      buildPoster();
      $("formView").classList.add("hide");
      $("resultView").classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function savePoster() {
      const node = $("poster");
      showToast("正在生成图片…");
      try {
        const canvas = await html2canvas(node, {
          backgroundColor: "#fffcf7",
          scale: Math.min(2.5, window.devicePixelRatio || 2),
          useCORS: true,
        });
        const link = document.createElement("a");
        const safe = (state.nickname.trim() || "summoner").replace(/[\\/:*?"<>|]/g, "_");
        link.download = `峡谷冤种门诊-诊断证明书-${safe}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        showToast("已保存，去群里晒吧");
      } catch (err) {
        console.error(err);
        showToast("保存失败，请尝试截图");
      }
    }

    $("nickname").addEventListener("input", (e) => {
      state.nickname = e.target.value;
      syncGenerate();
    });

    $("generateBtn").addEventListener("click", showResult);
    $("saveBtn").addEventListener("click", savePoster);
    $("backBtn").addEventListener("click", () => {
      $("resultView").classList.remove("show");
      $("formView").classList.remove("hide");
    });
    $("againBtn").addEventListener("click", () => {
      state.variant += 1;
      buildPoster();
      showToast(state.variant === 1 ? "已开具平行病历" : `平行病历 #${state.variant + 1}`);
    });

    renderOptions($("rankOptions"), RANKS, "rank");
    renderOptions($("recordOptions"), RECORDS, "record");
    renderOptions($("laneOptions"), LANES, "lane");
    syncGenerate();
  </script>
</body>
</html>
